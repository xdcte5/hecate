# Routing is ability-based via harness cards in registry.yaml.
# Explicit routing[] entries always win over routing_config blended selection.
routing: []

# Blended routing: local history + benchmark priors + heuristic router.
routing_config:
  mode: auto
  min_local_samples: 5
  blend:
    local: 0.5
    benchmark: 0.25
    heuristic: 0.25

# Failover order breaks ability-score ties (first match wins).
# Pi is first so implement steps prefer Pi when harnesses score equally.
failover:
  - pi
  - cursor
  - claude-code
  - codex

# Per-step harness preference — checked before global failover when routing plan steps.
step_routing:
  implement:
    prefer: [claude-code, codex, pi]
  test:
    prefer: [codex, claude-code]
  review:
    prefer: [claude-code]
    model_tier: capable
  debug:
    prefer: [codex, pi]

governance:
  requireGitSnapshotOnHandoff: true
  maxHandoffTokens: 8000
  maxTranscriptLines: 200
